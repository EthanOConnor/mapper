name: Publish tagged preview assets

on:
  push:
    branches: [topic/mobile-map-hub-flat-list]
    paths: [.github/workflows/publish-tagged-preview.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download tagged package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: EthanOConnor/mapper
          run-id: 30422967889
          pattern: Mapper-*
          path: release-assets
          merge-multiple: true

      - name: Inspect and upload draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.9.7-map-hub-faster-2026-07-28
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print -exec sha256sum {} \;
          gh release upload "$RELEASE_TAG" release-assets/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
